name: Publish fund prices

# The API's own timer only runs while the API is running. A free host that
# sleeps when idle, or one that serves the API as functions, has no such timer —
# so the schedule lives here instead, and the request doubles as the thing that
# wakes a sleeping instance.
#
# Needs two repository secrets: API_URL (e.g. https://nivesta-api.onrender.com)
# and CRON_SECRET, matching the one set on the API.
#
# GitHub queues scheduled runs rather than firing them on the second, and drops
# them entirely when the runners are busy. That is fine for a simulated price —
# a tick arriving late, or not at all, just means the next one moves further. A
# feed that has to be punctual belongs on a dedicated scheduler.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the next price
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL or CRON_SECRET is not set; nothing to call."
            exit 0
          fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/nav/tick" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $status"
          cat response.json

          # The secret is never echoed, so a failed run shows the status and the
          # API's own message and nothing else.
          [ "$status" = "200" ]
